# force-shadow's own add-on launcher page (2026-09-21). Not tied to any
# other add-on's engine -- ctrl_sock/engine_* are deliberately left
# unset (no button, no SET/GET traffic). launcher=1 tells force_shadow.c
# to build this page with build_launcher_tab() instead of the usual
# conf-driven layout: it lists every *other* populated addon_table[]
# slot automatically, so nothing here needs editing when a new add-on's
# own shadow_page.conf shows up on disk. See docs/adding-a-page.md's
# "Add-on launcher (tool add-ons)" section.
#
# Style (2026-09-22): force-acid's own td3 (TB-303 chassis) palette,
# hue-shifted from its yellow to orange -- same charcoal boxes/knobs,
# black chrome and red buttons, just the chassis/accent colour swapped
# (f5c400/ffe066/d9ac00 -> f57200/ffad66/d96500, same saturation and
# lightness, hue rotated ~48 deg to ~28 deg).
page=1
display_name=ADD-ONS
launcher=1
style=td3
theme_bg=f57200
theme_panel=f57200
theme_line=0a0a0a
theme_ink=f0ede4
theme_ink_dim=9a9689
theme_ink_faint=5a5648
theme_accent=f57200
theme_accent_hi=ffad66
theme_knob_face=2a2a2a
theme_knob_ring=050505
theme_bar=d96500
theme_seg_active=f57200
theme_seg_inactive=2a2a2a
theme_seg_active_tx=0a0a0a
theme_btn_text=ffffff
theme_well=0a0a0a
theme_knob_off=4a4a4a
theme_tab_on=1f1f1f
theme_lcd=0a0a0a
theme_box=1f1f1f
theme_btn_bg=e8341c
theme_chrome_ink=0a0a0a
theme_go_on=35d07f
theme_go_off=e8341c
theme_tabs=d96500
